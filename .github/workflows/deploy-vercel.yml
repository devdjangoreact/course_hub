name: CI and Deploy Vercel

# Push to main: test → write .env.prod from secret ENV_PROD → deploy Vercel.
# PR: test only.
#
# Single required GitHub Secret:
#   ENV_PROD — full contents of local .env.prod (gitignored; never commit it)
#
# .env.prod must include (for CI deploy):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# plus app settings (DATABASE_URL, BOT_TOKEN, BACKEND_URL, TELEGRAM_*, …).
# VERCEL_* keys are used only by CI; they are not synced into the Vercel app runtime env.
#
# Optional repo Variable:
#   VERCEL_PRODUCTION_URL — e.g. https://course-hub-….vercel.app
#   If set, CI overwrites BACKEND_URL before syncing app env.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install "poetry==1.8.4"

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run tests
        run: poetry run pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Write .env.prod from secret ENV_PROD
        env:
          ENV_PROD: ${{ secrets.ENV_PROD }}
        run: |
          set -euo pipefail
          if [ -z "${ENV_PROD}" ]; then
            echo "Secret ENV_PROD is empty. Paste your full .env.prod into GitHub Actions secret ENV_PROD." >&2
            exit 1
          fi
          printf '%s\n' "$ENV_PROD" > .env.prod
          echo ".env.prod" >> .gitignore

      - name: Load Vercel credentials from .env.prod
        id: vercel_creds
        run: |
          set -euo pipefail
          get_val() {
            local key="$1"
            local line value
            line=$(grep -E "^${key}=" .env.prod | tail -n1 || true)
            if [ -z "$line" ]; then
              echo "Missing ${key}= in ENV_PROD / .env.prod" >&2
              exit 1
            fi
            value="${line#*=}"
            # Strip Windows CRLF and surrounding quotes from secret file
            value="$(printf '%s' "$value" | tr -d '\r')"
            value="${value%\"}"
            value="${value#\"}"
            value="${value%\'}"
            value="${value#\'}"
            printf '%s' "$value"
          }
          TOKEN="$(get_val VERCEL_TOKEN)"
          ORG="$(get_val VERCEL_ORG_ID)"
          PROJECT="$(get_val VERCEL_PROJECT_ID)"
          if [ -z "$TOKEN" ] || [ -z "$ORG" ] || [ -z "$PROJECT" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID must be non-empty in .env.prod" >&2
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$ORG"
          echo "::add-mask::$PROJECT"
          {
            echo "token<<EOF"
            printf '%s\n' "$TOKEN"
            echo "EOF"
            echo "org<<EOF"
            printf '%s\n' "$ORG"
            echo "EOF"
            echo "project<<EOF"
            printf '%s\n' "$PROJECT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Loaded VERCEL_* from .env.prod (values hidden)."

      - name: Ensure production BACKEND_URL
        env:
          VERCEL_PRODUCTION_URL: ${{ vars.VERCEL_PRODUCTION_URL }}
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_PRODUCTION_URL:-}" ]; then
            if grep -q '^BACKEND_URL=' .env.prod; then
              sed -i "s|^BACKEND_URL=.*|BACKEND_URL=${VERCEL_PRODUCTION_URL}|" .env.prod
            else
              printf '\nBACKEND_URL=%s\n' "$VERCEL_PRODUCTION_URL" >> .env.prod
            fi
            echo "BACKEND_URL forced to repository variable VERCEL_PRODUCTION_URL"
          else
            echo "VERCEL_PRODUCTION_URL variable not set; using BACKEND_URL from ENV_PROD as-is"
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ steps.vercel_creds.outputs.token }}
          VERCEL_ORG_ID: ${{ steps.vercel_creds.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_creds.outputs.project }}
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Sync .env.prod → Vercel production app env
        env:
          VERCEL_TOKEN: ${{ steps.vercel_creds.outputs.token }}
          VERCEL_ORG_ID: ${{ steps.vercel_creds.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_creds.outputs.project }}
        run: |
          set -euo pipefail
          chmod +x scripts/sync-vercel-env.sh
          # Skip CI-only keys so they are not injected into the FastAPI runtime
          SKIP_KEYS="HOST PORT VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID" \
            ./scripts/sync-vercel-env.sh .env.prod production

      - name: Deploy to Vercel (production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ steps.vercel_creds.outputs.token }}
          VERCEL_ORG_ID: ${{ steps.vercel_creds.outputs.org }}
          VERCEL_PROJECT_ID: ${{ steps.vercel_creds.outputs.project }}
        run: |
          set -euo pipefail
          URL=$(vercel deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed: $URL"

      - name: Scrub local env file
        if: always()
        run: rm -f .env.prod
